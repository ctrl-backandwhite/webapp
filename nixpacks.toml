# ================================
# 🚀 Railway + Nixpacks config for Angular + Caddy
# ================================

# =====================================
# 🌍 Variables globales
# =====================================
[variables]
  NPM_CONFIG_UPDATE_NOTIFIER = 'false'
  NPM_CONFIG_FUND = 'false'

# =====================================
# ⚙️ Setup base con Node + jq
# =====================================
[phases.setup]
  nixPkgs = ['nodejs_22', 'jq']

# =====================================
# 📦 Instalar Caddy
# =====================================
[phases.caddy]
  dependsOn = ['setup']
  nixPkgs = ['caddy']
  nixpkgsArchive = 'ba913eda2df8eb72147259189d55932012df6301' # versión estable de Caddy 2.8.4

# =====================================
# 🧹 Formatear el Caddyfile
# =====================================
[phases.fmt]
  dependsOn = ['caddy']
  cmds = ['caddy fmt --overwrite Caddyfile']

# =====================================
# 🏗️ Build Angular App
# =====================================
[phases.build]
  cmds = [
    'npm ci',
    'npm run build'
  ]

# =====================================
# ✅ Verificación opcional de carpetas
# =====================================
[phases.verify]
  dependsOn = ['build']
  cmds = [
    'echo "Verificando contenido de /app/dist..."',
    'ls -la /app/dist || true',
    'ls -la /app/dist/webapp || true',
    'ls -la /app/dist/webapp/browser || true'
  ]

# =====================================
# 🚦 Iniciar servidor Caddy
# =====================================
[start]
  cmd = 'exec caddy run --config Caddyfile --adapter caddyfile 2>&1'
