<div class="navbar h-16 bg-base-100 border-b border-base-200">
  <div class="flex-none lg:hidden">
    <label for="admin-drawer" class="btn btn-square btn-ghost" [attr.aria-label]="'nav.openMenu' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-6 w-6">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </label>
  </div>
  <div class="flex-1 flex items-center gap-2">
    <button (click)="onToggleSidebar()" class="btn btn-ghost btn-sm hidden lg:inline-flex"
      [attr.aria-label]="'nav.pinMenu' | translate">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
  <div class="flex items-center gap-1 sm:gap-2">
    <div class="dropdown dropdown-end">
      <button class="btn btn-ghost btn-sm" [attr.aria-label]="'nav.translations' | translate">
        <i class="fa-solid fa-language text-lg"></i>
      </button>
      <ul class="dropdown-content menu rounded-box bg-base-100 shadow-md w-max p-1">
        <li>
          <button class="justify-start gap-2 p-2 whitespace-nowrap" (click)="onChangeLanguage('es')">
            🇪🇸 <span>{{ 'lang.spanish' | translate }}</span>
          </button>
        </li>
        <li>
          <button class="justify-start gap-2 p-2 whitespace-nowrap" (click)="onChangeLanguage('en')">
            🇺🇸 <span>{{ 'lang.english' | translate }}</span>
          </button>
        </li>
      </ul>
    </div>
    <button class="btn btn-ghost btn-sm flex items-center gap-2" (click)="onStartTour()"
      [attr.aria-label]="'nav.tour' | translate" [attr.title]="'nav.tour' | translate">
      <i class="fa-solid fa-circle-play text-lg"></i>
      <span class="hidden sm:inline text-xs">{{ 'nav.tour' | translate }}</span>
    </button>
    <button class="btn btn-ghost btn-sm" [attr.aria-label]="'nav.notifications' | translate">
      <i class="fa-solid fa-bell text-lg"></i>
    </button>
    <div class="dropdown dropdown-end mr-2 sm:mr-4">
      <div tabindex="0" role="button" class="avatar placeholder">
        <div class="bg-primary text-primary-content w-8 h-8 rounded-full flex items-center justify-center">
          <span>{{ userInitials() }}</span>
        </div>
      </div>
      <ul tabindex="0"
        class="dropdown-content menu p-3 bg-base-100 rounded-box w-56 mt-3 border border-base-200 shadow-none">
        <li class="flex flex-col items-center gap-1 mb-2">
          <div class="avatar">
            <div
              class="w-12 h-12 rounded-full bg-primary text-primary-content flex items-center justify-center text-lg font-semibold">
              <span>{{ userInitials() }}</span>
            </div>
          </div>
          <span class="font-medium text-sm text-base-content">{{ userName() }}</span>
        </li>
        <li>
          <a
            class="flex flex-row items-center justify-center gap-2 text-sm py-2 text-base-content/60 hover:bg-base-200 transition-colors">
            <i class="fa-solid fa-cog"></i>
            <span>{{ 'nav.settings' | translate }}</span>
          </a>
        </li>
        <li>
          <a class="flex flex-row items-center justify-center gap-2 text-sm py-2 text-base-content/60 hover:bg-base-200 transition-colors"
            (click)="onLogout()">
            <i class="fa-solid fa-sign-out-alt"></i>
            <span>{{ 'nav.logout' | translate }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
