<div [class]="isCollapsed() ? 'w-20' : 'w-72'"
  class="min-h-full bg-base-100 border-r border-base-200 transition-all duration-200">
  <div class="h-14 px-4 flex items-center justify-center">
    <div class="flex items-center gap-3 overflow-hidden">
      <div class="avatar placeholder">
        <div class="bg-primary text-primary-content rounded-lg w-10 flex items-center justify-center">
          <span>B&W</span>
        </div>
      </div>
      <div [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
        class="transition-all duration-200">
        <p class="font-semibold">Back & White</p>
        <p class="text-xs text-base-content/60">Administración</p>
      </div>
    </div>
  </div>
  <ul [class]="isCollapsed() ? 'menu w-full px-0 py-2 mt-3 space-y-0.5' : 'menu w-full px-0 py-2 mt-3 space-y-[5px]'">
    <li class="w-full">
      <a [class]="isCollapsed() ? 'menu-link active w-full flex flex-col items-center justify-center px-0 gap-0 py-0 rounded-none transition-colors duration-1000' : 'menu-link active w-full flex items-center justify-start gap-4 px-4 rounded-none transition-colors duration-1000'"
        title="Dashboard">
        <i [class]="isCollapsed() ? 'fa-solid fa-chart-line text-lg' : 'fa-solid fa-chart-line'"></i>
        <span [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
          class="transition-all duration-200 flex-1">Dashboard</span>
        <i [class.opacity-0]="true" class="fa-solid fa-chevron-down"></i>
      </a>
    </li>
    <li class="menu-item w-full relative">
      <details [open]="!isCollapsed()" class="group no-marker">
        <summary
          [class]="isCollapsed() ? 'menu-link menu-summary w-full flex flex-col items-center justify-center px-0 gap-0 py-3 rounded-none list-none transition-colors duration-1000' : 'menu-link menu-summary w-full flex items-center justify-start gap-4 px-4 rounded-none list-none transition-colors duration-1000'"
          title="Usuarios">
          <i [class]="isCollapsed() ? 'fa-solid fa-users text-lg' : 'fa-solid fa-users'"></i>
          <span [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="transition-all duration-200 flex-1">Usuarios</span>
          <i [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="fa-solid fa-chevron-down transition-all duration-1000 group-open:rotate-180"></i>
        </summary>
        <ul [class.hidden]="isCollapsed()"
          class="submenu pl-10 pr-2 py-1 overflow-hidden max-h-0 opacity-0 transition-all duration-1000 ease-in-out group-open:max-h-40 group-open:opacity-100">
          <li><a class="w-full text-sm transition-colors duration-1000" title="Lista">Lista</a></li>
          <li><a class="w-full text-sm transition-colors duration-1000" title="Roles">Roles</a></li>
          <li><a class="w-full text-sm transition-colors duration-1000" title="Permisos">Permisos</a></li>
        </ul>
      </details>
    </li>
    <li class="menu-item w-full relative">
      <details [open]="false" class="group no-marker">
        <summary
          [class]="isCollapsed() ? 'menu-link menu-summary w-full flex flex-col items-center justify-center px-0 gap-0 py-3 rounded-none list-none transition-colors duration-1000' : 'menu-link menu-summary w-full flex items-center justify-start gap-4 px-4 rounded-none list-none transition-colors duration-1000'"
          title="Ventas">
          <i [class]="isCollapsed() ? 'fa-solid fa-bag-shopping text-lg' : 'fa-solid fa-bag-shopping'"></i>
          <span [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="transition-all duration-200 flex-1">Ventas</span>
          <i [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="fa-solid fa-chevron-down transition-all duration-1000 group-open:rotate-180"></i>
        </summary>
        <ul [class.hidden]="isCollapsed()"
          class="submenu pl-10 pr-2 py-1 overflow-hidden max-h-0 opacity-0 transition-all duration-1000 ease-in-out group-open:max-h-32 group-open:opacity-100">
          <li><a class="w-full text-sm transition-colors duration-1000" title="Órdenes">Órdenes</a></li>
          <li><a class="w-full text-sm transition-colors duration-1000" title="Clientes">Clientes</a></li>
        </ul>
      </details>
    </li>
    <li class="menu-item w-full relative">
      <details [open]="false" class="group no-marker">
        <summary
          [class]="isCollapsed() ? 'menu-link menu-summary w-full flex flex-col items-center justify-center px-0 gap-0 py-3 rounded-none list-none transition-colors duration-1000' : 'menu-link menu-summary w-full flex items-center justify-start gap-4 px-4 rounded-none list-none transition-colors duration-1000'"
          title="Reportes">
          <i [class]="isCollapsed() ? 'fa-solid fa-chart-pie text-lg' : 'fa-solid fa-chart-pie'"></i>
          <span [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="transition-all duration-200 flex-1">Reportes</span>
          <i [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="fa-solid fa-chevron-down transition-all duration-1000 group-open:rotate-180"></i>
        </summary>
        <ul [class.hidden]="isCollapsed()"
          class="submenu pl-10 pr-2 py-1 overflow-hidden max-h-0 opacity-0 transition-all duration-1000 ease-in-out group-open:max-h-40 group-open:opacity-100">
          <li><a class="w-full text-sm transition-colors duration-1000" title="Mensual">Mensual</a></li>
          <li><a class="w-full text-sm transition-colors duration-1000" title="Anual">Anual</a></li>
          <li><a class="w-full text-sm transition-colors duration-1000" title="KPI">KPI</a></li>
        </ul>
      </details>
    </li>
    <li class="menu-item w-full relative">
      <details [open]="false" class="group no-marker">
        <summary
          [class]="isCollapsed() ? 'menu-link menu-summary w-full flex flex-col items-center justify-center px-0 gap-0 py-3 rounded-none list-none transition-colors duration-1000' : 'menu-link menu-summary w-full flex items-center justify-start gap-4 px-4 rounded-none list-none transition-colors duration-1000'"
          title="Configuración">
          <i [class]="isCollapsed() ? 'fa-solid fa-gear text-lg' : 'fa-solid fa-gear'"></i>
          <span [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="transition-all duration-200 flex-1">Configuración</span>
          <i [class.opacity-0]="isCollapsed()" [class.w-0]="isCollapsed()" [class.overflow-hidden]="isCollapsed()"
            class="fa-solid fa-chevron-down transition-all duration-1000 group-open:rotate-180"></i>
        </summary>
        <ul [class.hidden]="isCollapsed()"
          class="submenu pl-10 pr-2 py-1 overflow-hidden max-h-0 opacity-0 transition-all duration-1000 ease-in-out group-open:max-h-32 group-open:opacity-100">
          <li><a class="w-full text-sm transition-colors duration-1000" title="Preferencias">Preferencias</a>
          </li>
          <li><a class="w-full text-sm transition-colors duration-1000" title="Seguridad">Seguridad</a></li>
        </ul>
      </details>
    </li>
  </ul>
</div>
