<div class="w-full flex flex-col p-2">
    <div class="card bg-base-100 shadow-sm w-full p-5">
        <div class="w-full">
            <app-data-table tableId="oauth-clients" [title]="'oauthClients.title' | translate" [columnDefs]="columnDefs"
                [defaultColDef]="defaultColDef" [loadFn]="loadOauthClients" [rowActions]="rowActions" [pageSize]="10"
                [pageSizeOptions]="[10, 20, 50]" [reloadToken]="reloadToken" [enableSelection]="true"
                [getRowId]="trackByOauthClientId" (rowClick)="openDetail($event)">
                <button data-table-actions class="btn btn-circle bg-base-200 border-none hover:bg-base-300"
                    data-tour="tour-create" [attr.title]="'oauthClients.add' | translate" (click)="openCreate()">
                    <i class="fa-solid fa-plus text-base-content/60 text-lg"></i>
                </button>
            </app-data-table>
        </div>
    </div>

    <div class="modal" [class.modal-open]="isModalOpen()">
        <div class="modal-box dt-modal-box">
            <div class="dt-modal-header">
                <h3 class="dt-modal-title">
                    @if (isEditMode()) {
                    <span>{{ 'oauthClients.editTitle' | translate }}</span>
                    } @else {
                    <span>{{ 'oauthClients.createTitle' | translate }}</span>
                    }
                </h3>
            </div>
            <form class="dt-form dt-form-grid" [formGroup]="oauthClientForm" (ngSubmit)="submitClient()">
                <label class="dt-field">
                    <span class="dt-label">{{ 'oauthClients.clientIdLabel' | translate }}</span>
                    <input class="dt-input" type="text" formControlName="clientId" />
                    @if (oauthClientForm.controls.clientId.touched && oauthClientForm.controls.clientId.invalid) {
                    <span class="dt-error">{{ 'oauthClients.clientIdRequired' | translate }}</span>
                    }
                </label>

                <label class="dt-field">
                    <span class="dt-label">{{ 'oauthClients.clientSecretLabel' | translate }}</span>
                    <input class="dt-input" type="password" formControlName="clientSecret" />
                </label>

                <label class="dt-field dt-field-full">
                    <span class="dt-label">{{ 'oauthClients.scopeIdsLabel' | translate }}</span>
                    @if (scopes().length) {
                    <input class="dt-input" type="text" [value]="scopeSearch()"
                        (input)="scopeSearch.set($any($event.target).value)"
                        [placeholder]="'oauthClients.scopeSearchPlaceholder' | translate" />
                    }
                    <div class="dt-multi-select" [class.dt-multi-select-empty]="!scopes().length">
                        @if (!scopes().length) {
                        <div class="dt-empty-box">{{ 'oauthClients.noScopes' | translate }}</div>
                        }
                        @for (scope of filteredScopes(); track scope.id) {
                        <label class="dt-option">
                            <input type="checkbox"
                                [checked]="isSelected(oauthClientForm.controls.scopeIds.value, scope.id)"
                                (change)="toggleSelection('scopeIds', scope.id)" />
                            <span>{{ scope.name }}</span>
                        </label>
                        }
                    </div>
                </label>

                <label class="dt-field dt-field-full">
                    <span class="dt-label">{{ 'oauthClients.redirectUriIdsLabel' | translate }}</span>
                    @if (redirectUris().length) {
                    <input class="dt-input" type="text" [value]="redirectUriSearch()"
                        (input)="redirectUriSearch.set($any($event.target).value)"
                        [placeholder]="'oauthClients.redirectUriSearchPlaceholder' | translate" />
                    }
                    <div class="dt-multi-select" [class.dt-multi-select-empty]="!redirectUris().length">
                        @if (!redirectUris().length) {
                        <div class="dt-empty-box">{{ 'oauthClients.noRedirectUris' | translate }}</div>
                        }
                        @for (redirectUri of filteredRedirectUris(); track redirectUri.id) {
                        <label class="dt-option">
                            <input type="checkbox"
                                [checked]="isSelected(oauthClientForm.controls.redirectUriIds.value, redirectUri.id)"
                                (change)="toggleSelection('redirectUriIds', redirectUri.id)" />
                            <span>{{ redirectUri.name }}</span>
                        </label>
                        }
                    </div>
                </label>

                <label class="dt-field dt-field-full">
                    <span class="dt-label">{{ 'oauthClients.grantTypeIdsLabel' | translate }}</span>
                    @if (grantTypes().length) {
                    <input class="dt-input" type="text" [value]="grantTypeSearch()"
                        (input)="grantTypeSearch.set($any($event.target).value)"
                        [placeholder]="'oauthClients.grantTypeSearchPlaceholder' | translate" />
                    }
                    <div class="dt-multi-select" [class.dt-multi-select-empty]="!grantTypes().length">
                        @if (!grantTypes().length) {
                        <div class="dt-empty-box">{{ 'oauthClients.noGrantTypes' | translate }}</div>
                        }
                        @for (grantType of filteredGrantTypes(); track grantType.id) {
                        <label class="dt-option">
                            <input type="checkbox"
                                [checked]="isSelected(oauthClientForm.controls.grantTypeIds.value, grantType.id)"
                                (change)="toggleSelection('grantTypeIds', grantType.id)" />
                            <span>{{ grantType.value }}</span>
                        </label>
                        }
                    </div>
                </label>

                @if (errorMsg()) {
                <div class="dt-error dt-field-full">{{ errorMsg() }}</div>
                }

                <div class="dt-actions dt-field-full">
                    <button type="button" class="btn btn-ghost btn-sm" (click)="closeModal()">
                        {{ 'common.cancel' | translate }}
                    </button>
                    <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving()">
                        @if (saving()) {
                        <span>{{ 'common.saving' | translate }}</span>
                        } @else {
                        <span>{{ 'common.save' | translate }}</span>
                        }
                    </button>
                </div>
            </form>
        </div>
        <div class="modal-backdrop" (click)="closeModal()"></div>
    </div>

    <app-confirm-dialog [open]="isDeleteOpen()" [title]="'oauthClients.deleteTitle' | translate"
        [message]="'oauthClients.deleteMessage' | translate:{ name: deleteTarget()?.clientId }"
        [confirmLabel]="'common.delete' | translate" [cancelLabel]="'common.cancel' | translate" [busy]="deleting()"
        [error]="deleteError()" (confirm)="confirmDelete()" (cancel)="closeDelete()">
    </app-confirm-dialog>

    <app-detail-sidebar [open]="isDetailOpen()" [title]="'oauthClients.detailTitle' | translate"
        (close)="closeDetail()">
        @if (detailItem(); as item) {
        <div class="dt-detail-list">
            <div class="dt-detail-row dt-detail-row-center">
                <strong class="dt-detail-id">ID {{ item.id }}</strong>
            </div>
            <div class="dt-detail-row">
                <span class="dt-detail-label">{{ 'oauthClients.clientIdLabel' | translate }}</span>
                <span class="dt-detail-value">{{ item.clientId }}</span>
            </div>
            <app-audit-info [data]="item" />
            <app-nested-entities [title]="'oauthClients.scopesLabel' | translate" [entities]="item.scopes" />
            <app-nested-entities [title]="'oauthClients.redirectUrisLabel' | translate"
                [entities]="item.redirectUris" />
            <app-nested-entities [title]="'oauthClients.grantTypesLabel' | translate" [entities]="item.grantTypes" />
        </div>
        }
    </app-detail-sidebar>
</div>
