<div class="w-full flex flex-col p-2">
  <div class="card bg-base-100 shadow-sm w-full p-5">
    <div class="w-full">
      <app-data-table tableId="roles" title="Roles" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
        [loadFn]="loadRoles" [rowActions]="rowActions" [pageSize]="10" [pageSizeOptions]="[10, 20, 50]"
        [reloadToken]="reloadToken" [enableSelection]="true">
        <button data-table-actions class="btn btn-circle bg-base-200 border-none hover:bg-base-300" title="Agregar rol"
          (click)="openCreate()">
          <i class="fa-solid fa-plus text-base-content/60 text-lg"></i>
        </button>
      </app-data-table>
    </div>
  </div>

  <div class="modal" [class.modal-open]="isModalOpen()">
    <div class="modal-box dt-modal-box">
      <div class="dt-modal-header">
        <h3 class="dt-modal-title">
          {{ isEditMode() ? 'Editar Rol' : 'Crear Rol' }}
        </h3>
      </div>
      <form class="dt-form" [formGroup]="roleForm" (ngSubmit)="submitRole()">
        <label class="dt-field">
          <span class="dt-label">Nombre</span>
          <input class="dt-input" type="text" formControlName="name" />
          <span *ngIf="roleForm.controls.name.touched && roleForm.controls.name.invalid" class="dt-error">El nombre es
            obligatorio</span>
        </label>

        <label class="dt-field">
          <span class="dt-label">Nombre unico</span>
          <input class="dt-input" type="text" formControlName="uniqueName" />
          <span *ngIf="roleForm.controls.uniqueName.touched && roleForm.controls.uniqueName.invalid" class="dt-error">El
            nombre unico es obligatorio</span>
        </label>

        <label class="dt-field">
          <span class="dt-label">Descripcion</span>
          <textarea class="dt-textarea" rows="3" formControlName="description"></textarea>
        </label>

        <label class="dt-toggle">
          <span class="dt-label">Activo</span>
          <input type="checkbox" class="toggle toggle-primary" formControlName="enabled" />
        </label>

        <div *ngIf="errorMsg()" class="dt-error">{{ errorMsg() }}</div>

        <div class="dt-actions">
          <button type="button" class="btn btn-ghost btn-sm" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving()">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
    <div class="modal-backdrop" (click)="closeModal()"></div>
  </div>

  <app-confirm-dialog [open]="isDeleteOpen()" [title]="'Eliminar Rol'"
    [message]="deleteTarget() ? 'Seguro que deseas eliminar el rol ' + deleteTarget()!.name + '?' : ''"
    [confirmLabel]="'Eliminar'" [cancelLabel]="'Cancelar'" [busy]="deleting()" [error]="deleteError()"
    (confirm)="confirmDelete()" (cancel)="closeDelete()">
  </app-confirm-dialog>
</div>
