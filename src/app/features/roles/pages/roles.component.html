<div class="w-full flex flex-col p-2">
  <!-- Breadcrumb -->
  <div class="w-full p-[10px] mb-[25px] bg-base-100 rounded-box">
    <nav aria-label="Breadcrumb">
      <ul class="breadcrumb flex gap-2 text-sm text-base-content/50">
        <li><a href="/admin" class="hover:text-primary">Administración</a></li>
        <li><span class="mx-1">/</span></li>
        <li><a href="/admin/roles" class="text-primary font-semibold">Roles</a></li>
      </ul>
    </nav>
  </div>
  <div class="card bg-base-100 shadow-sm w-full p-5">
    <div class="flex justify-end mb-4">
      <button class="btn btn-circle bg-base-200 border-none hover:bg-base-300" title="Agregar rol">
        <i class="fa-solid fa-plus text-base-content/60 text-lg"></i>
      </button>
    </div>
    <div class="w-full">
      <ag-grid-angular class="w-full" [rowData]="rowData" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
        [domLayout]="'autoHeight'" [animateRows]="true" [suppressCellFocus]="true"
        [overlayNoRowsTemplate]="'No hay roles para mostrar'" [theme]="theme" [pagination]="pagination"
        [paginationPageSize]="paginationPageSize"></ag-grid-angular>
      <div *ngIf="errorMsg" class="text-error mt-2">{{ errorMsg }}</div>
    </div>
  </div>
</div>
