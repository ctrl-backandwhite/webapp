<div data-tour="table" class="w-full flex flex-col gap-3 dt-table-fade">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-end gap-2">
        <div class="flex flex-wrap items-center justify-end gap-2">
            <button class="btn btn-ghost btn-sm" type="button" (click)="exportCsv()">
                <span>{{ 'table.exportCsv' | translate }}</span>
            </button>
            <ng-content select="[data-table-actions]"></ng-content>
        </div>
    </div>

    <div *ngIf="bulkActions.length && selectedRows().length" class="flex items-center gap-2">
        <span class="text-xs text-base-content/60">
            {{ 'table.selected' | translate:{ count: selectedRows().length } }}
        </span>
        <button *ngFor="let action of bulkActions" class="btn btn-ghost btn-xs" type="button"
            (click)="onBulkAction(action)">
            {{ action.label }}
        </button>
    </div>

    <div class="w-full overflow-x-auto">
        <ag-grid-angular class="min-w-[640px] w-full" [rowData]="rows()" [columnDefs]="gridColumnDefs"
            [defaultColDef]="defaultColDef" [domLayout]="'autoHeight'" [animateRows]="true" [suppressCellFocus]="true"
            [overlayNoRowsTemplate]="overlayNoRowsTemplate" [localeText]="localeText()" [theme]="theme"
            [rowSelection]="enableSelection ? 'multiple' : 'single'" [suppressRowClickSelection]="enableSelection"
            (gridReady)="onGridReady($event)" (selectionChanged)="onSelectionChanged()" (sortChanged)="onSortChanged()"
            (filterChanged)="onFilterChanged()" (rowClicked)="onRowClicked($event)" [getRowId]="gridGetRowId">
        </ag-grid-angular>
    </div>

    <div *ngIf="loading()" class="text-xs text-base-content/60">{{ 'table.loading' | translate }}</div>
    <div *ngIf="error()" class="text-error text-xs">{{ error() }}</div>

    <div *ngIf="totalPages() >= 1" class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-2">
            <span *ngIf="title" class="text-xs font-semibold text-base-content/70">{{ title }}</span>
            <span *ngIf="totalRows()" class="badge badge-ghost text-xs">{{ totalRows() }}</span>
        </div>
        <div class="flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2 flex-nowrap">
                <button class="btn btn-ghost btn-xs" type="button" [disabled]="page() === 1"
                    (click)="goToPage(page() - 1)">
                    <span>{{ 'table.previous' | translate }}</span>
                </button>
                <button class="btn btn-ghost btn-xs" type="button" [disabled]="page() >= totalPages()"
                    (click)="goToPage(page() + 1)">
                    <span>{{ 'table.next' | translate }}</span>
                </button>
                <span class="text-xs text-base-content/60 whitespace-nowrap">
                    {{ 'table.pageOf' | translate:{ page: page(), total: totalPages() } }}
                </span>
                <select class="select select-bordered select-sm" [value]="pageSizeSignal()"
                    (change)="onPageSizeChange($event)">
                    <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
                </select>
            </div>
        </div>
    </div>
</div>
